<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paul Jison — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── CSS VARIABLES ─────────────────────────────────────────────── */
    :root[data-theme="dark"] {
      --bg: #0a0912;
      --nav-bg: rgba(255,255,255,0.05);
      --nav-border: rgba(255,255,255,0.09);
      --card-bg: rgba(255,255,255,0.035);
      --card-border: rgba(255,255,255,0.09);
      --input-bg: rgba(255,255,255,0.04);
      --input-border: rgba(255,255,255,0.1);
      --text-primary: #f5f4f8;
      --text-secondary: #9c94ac;
      --text-muted: #6f6880;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --orange: #f59e0b;
      --blue: #3b82f6;
      --dot: rgba(255,255,255,0.055);
      --nav-pill-active-bg: #f5f4f8;
      --nav-pill-active-text: #0a0912;
      --blob1-color: rgba(139,92,246,0.33);
      --blob2-color: rgba(236,72,153,0.2);
      --blob3-color: rgba(59,130,246,0.22);
    }
    :root[data-theme="light"] {
      --bg: #fffdfa;
      --nav-bg: rgba(255,255,255,0.75);
      --nav-border: rgba(124,58,237,0.14);
      --card-bg: #ffffff;
      --card-border: rgba(124,58,237,0.12);
      --input-bg: #f7f5fa;
      --input-border: rgba(124,58,237,0.16);
      --text-primary: #221f2e;
      --text-secondary: #6b6478;
      --text-muted: #948da0;
      --purple: #7c3aed;
      --pink: #ec4899;
      --orange: #d97706;
      --blue: #2563eb;
      --dot: rgba(124,58,237,0.09);
      --nav-pill-active-bg: #221f2e;
      --nav-pill-active-text: #fff;
      --blob1-color: rgba(124,58,237,0.18);
      --blob2-color: rgba(236,72,153,0.12);
      --blob3-color: rgba(37,99,235,0.12);
    }

    /* ── KEYFRAMES ─────────────────────────────────────────────────── */
    @keyframes textShine {
      0%   { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    @keyframes floatBlob {
      0%, 100% { transform: translate(0,0) scale(1); }
      50%       { transform: translate(0,-18px) scale(1.04); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes marqueeScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ── BASE ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    ::selection { background: #ec4899; color: #fff; }

    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    a { color: var(--purple); text-decoration: none; }
    a:hover { color: var(--pink); }

    button { font-family: 'Manrope', sans-serif; cursor: pointer; }
    input, textarea { font-family: 'Manrope', sans-serif; }

    /* ── SHINE TEXT ────────────────────────────────────────────────── */
    .shine {
      background-image: linear-gradient(100deg, var(--purple) 20%, #ffffff 45%, var(--pink) 70%, var(--purple) 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: textShine 4s linear infinite;
    }
    :root[data-theme="light"] .shine {
      background-image: linear-gradient(100deg, var(--purple) 20%, #9d71f0 45%, var(--pink) 70%, var(--purple) 100%);
    }

    /* ── APP WRAPPER ───────────────────────────────────────────────── */
    #app {
      position: relative;
      min-height: 100vh;
    }

    /* ── DOT GRID ──────────────────────────────────────────────────── */
    .dot-grid {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── BLOBS ─────────────────────────────────────────────────────── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      will-change: transform;
    }
    #blob1 {
      width: min(46vw, 620px);
      height: min(46vw, 620px);
      background: var(--blob1-color);
      top: -10%;
      left: -6%;
      animation: floatBlob 14s ease-in-out infinite;
    }
    #blob2 {
      width: min(50vw, 680px);
      height: min(50vw, 680px);
      background: var(--blob2-color);
      bottom: -14%;
      right: -8%;
      animation: floatBlob 18s ease-in-out infinite reverse;
    }
    #blob3 {
      width: min(34vw, 460px);
      height: min(34vw, 460px);
      background: var(--blob3-color);
      top: 38%;
      left: 42%;
      animation: floatBlob 16s ease-in-out infinite;
    }

    /* ── NAV ───────────────────────────────────────────────────────── */
    #nav {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 1160px;
      width: calc(100% - 32px);
    }

    #theme-toggle {
      order: 1;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.25s, transform 0.2s;
    }
    #theme-toggle:hover { border-color: var(--purple); transform: scale(1.08); }
    #theme-toggle svg { width: 18px; height: 18px; }

    #nav-pills {
      order: 2;
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .nav-pill-container {
      position: relative;
      display: flex;
      flex-direction: row;
      gap: 4px;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--nav-border);
      border-radius: 999px;
      padding: 6px;
    }

    #nav-slider {
      position: absolute;
      top: 6px;
      bottom: 6px;
      width: 100px;
      background: var(--nav-pill-active-bg);
      border-radius: 999px;
      z-index: 0;
      transition: left 0.4s cubic-bezier(0.65,0,0.35,1), width 0.4s cubic-bezier(0.65,0,0.35,1);
      pointer-events: none;
    }

    .nav-btn {
      position: relative;
      z-index: 1;
      width: 100px;
      text-align: center;
      padding: 10px 6px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      transition: color 0.2s;
      white-space: nowrap;
    }
    .nav-btn.active { color: var(--nav-pill-active-text); }
    .nav-btn:not(.active):hover { color: var(--text-primary); }

    #book-btn {
      order: 3;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 999px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-primary);
      font-weight: 700;
      font-size: 13.5px;
      flex-shrink: 0;
      transition: border-color 0.25s, transform 0.25s;
    }
    #book-btn:hover { border-color: var(--purple); transform: translateY(-2px) scale(1.02); }
    #book-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── VIEW CONTENT ──────────────────────────────────────────────── */
    #view-content {
      position: relative;
      z-index: 1;
    }

    /* ── HERO ──────────────────────────────────────────────────────── */
    #section-home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 140px 24px 60px;
      gap: 26px;
      text-align: center;
    }

    .profile-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      flex-shrink: 0;
    }
    .profile-ring-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--card-bg);
      position: relative;
    }
    .profile-ring-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-initials {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 800;
    }

    .hero-h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 4.4vw, 40px);
      color: var(--text-primary);
      line-height: 1.2;
      animation: fadeUp 0.7s ease both;
    }

    .chat-container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-msg {
      display: flex;
    }
    .chat-msg.user { justify-content: flex-end; }
    .chat-msg.bot  { justify-content: flex-start; }

    .chat-bubble {
      max-width: 82%;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 14.5px;
      line-height: 1.7;
    }
    .chat-bubble.user {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
    }
    .chat-bubble.bot {
      background: var(--card-bg);
      color: var(--text-primary);
      border: 1px solid var(--card-border);
    }

    .chat-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 6px;
    }

    .chat-pill {
      padding: 9px 18px;
      border-radius: 999px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
    }
    .chat-pill:hover {
      border-color: var(--purple);
      color: var(--text-primary);
      transform: translateY(-2px);
    }

    .chat-form {
      display: flex;
      gap: 10px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 999px;
      padding: 6px 6px 6px 20px;
      align-items: center;
    }
    .chat-form input {
      flex: 1;
      background: transparent;
      color: var(--text-primary);
      border: none;
      outline: none;
      font-size: 14px;
      font-family: 'Manrope', sans-serif;
    }
    .chat-form input::placeholder { color: var(--text-muted); }
    .chat-submit {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.2s;
    }
    .chat-submit:hover { opacity: 0.85; transform: scale(1.06); }
    .chat-submit svg { width: 16px; height: 16px; }

    .scroll-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 12.5px;
      cursor: pointer;
      margin-top: 14px;
      transition: color 0.2s;
    }
    .scroll-hint:hover { color: var(--text-secondary); }
    .scroll-hint svg { width: 18px; height: 18px; }

    /* ── ABOUT SECTION ─────────────────────────────────────────────── */
    #section-about {
      max-width: 1160px;
      margin: 0 auto;
      padding: 60px 20px 110px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .about-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .about-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      transition: border-color 0.25s, transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .about-card:hover {
      border-color: var(--purple);
      transform: translateY(-3px);
    }

    /* Card A */
    .card-name {
      flex: 1 1 260px;
      min-width: 240px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }
    .card-name h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(24px, 3vw, 30px);
      line-height: 1.15;
      color: var(--text-primary);
    }
    .card-name-bar {
      width: 34px;
      height: 3px;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      border-radius: 2px;
      margin: 6px 0;
    }
    .card-name-role {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Card B */
    .card-facts {
      flex: 2 1 420px;
      min-width: 300px;
      padding: 22px 8px 8px;
      display: flex;
      flex-direction: column;
    }
    .card-facts-header {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 14px;
    }
    .facts-row {
      display: flex;
      flex-wrap: wrap;
      flex: 1;
    }
    .fact-col {
      flex: 1 1 160px;
      padding: 10px 18px 18px;
      border-left: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .fact-col:first-child { border-left: none; }
    .fact-title {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-primary);
    }
    .fact-text {
      max-height: 20px;
      overflow: hidden;
      transition: max-height 0.4s ease;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
    }
    .fact-col:hover .fact-text { max-height: 220px; }

    /* Row 2 */
    .about-row-2 {
      align-items: stretch;
    }

    /* Card C - Mindset */
    .card-mindset {
      flex: 1 1 280px;
      min-width: 260px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card-mindset-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--text-primary);
    }
    .card-mindset-text {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-secondary);
    }
    .card-mindset-bottom {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    /* Peek carousel */
    .peek-carousel {
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 4/3;
      position: relative;
      cursor: pointer;
    }
    .peek-frame {
      position: absolute;
      inset: 0;
    }
    .peek-frame img, .peek-frame .img-placeholder {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .peek-label {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: rgba(10,9,18,0.75);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      pointer-events: none;
      z-index: 4;
    }

    /* Card D - Portrait + Location */
    .card-col-d {
      flex: 1 1 240px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .portrait-carousel {
      flex: 1;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      min-height: 200px;
      position: relative;
    }
    .portrait-frame {
      position: absolute;
      inset: 0;
      transition: opacity 0.9s ease;
    }
    .portrait-frame img, .portrait-frame .img-placeholder {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-location {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.25s, transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .card-location:hover { border-color: var(--purple); transform: translateY(-3px); }
    .location-city {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 19px;
      color: var(--text-primary);
    }
    .location-coords {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Card E - Craft + Hackathon */
    .card-col-e {
      flex: 1 1 280px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card-craft {
      flex: 1;
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card-craft-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--text-primary);
    }
    .card-craft-text {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-secondary);
    }
    .tech-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }
    .tech-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 6px 11px;
      border-radius: 999px;
    }
    .card-hackathon {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-hackathon-text {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-secondary);
    }
    .status-badge {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #4ade80;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 0 3px rgba(74,222,128,0.2);
      flex-shrink: 0;
    }

    /* ── MARQUEE ────────────────────────────────────────────────────── */
    .marquee-wrap {
      overflow: hidden;
      position: relative;
      padding: 20px 0;
      mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    }
    #skills-marquee {
      display: flex;
      gap: 16px;
      width: max-content;
      animation: marqueeScroll 30s linear infinite;
    }
    #skills-marquee:hover { animation-play-state: paused; }
    .marquee-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
      flex: none;
    }

    /* ── PROJECTS SECTION ──────────────────────────────────────────── */
    #section-projects {
      max-width: 1160px;
      margin: 0 auto;
      padding: 20px 32px 110px;
    }
    .projects-header {
      text-align: center;
      margin-bottom: 12px;
    }
    .projects-h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(32px, 5vw, 46px);
      line-height: 1.1;
    }
    .projects-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: 12px;
      margin-bottom: 56px;
    }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
      gap: 40px 32px;
    }
    .project-wrapper {
      transition: transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .project-wrapper:hover { transform: translateY(-6px); }
    .project-meta {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
    }
    .project-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .project-meta-line {
      width: 24px;
      height: 1px;
      background: var(--text-muted);
      opacity: 0.4;
    }
    .project-kicker {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .project-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 26px;
      color: var(--text-primary);
      margin-bottom: 14px;
    }
    .project-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
    }
    .project-desc {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin: 0 0 18px;
    }
    .project-img-area {
      position: relative;
      aspect-ratio: 16/10.5;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 16px 34px -14px rgba(0,0,0,0.4);
      background: #111;
      cursor: pointer;
    }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .project-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 999px;
    }
    .projects-github {
      text-align: center;
      margin-top: 56px;
    }
    .projects-github a {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s, transform 0.2s;
    }
    .projects-github a:hover { color: var(--purple); transform: translateX(2px); }

    /* ── SKILLS SECTION ────────────────────────────────────────────── */
    #section-skills {
      max-width: 1160px;
      margin: 0 auto;
      padding: 20px 20px 110px;
    }
    .skills-header {
      text-align: center;
      margin-bottom: 12px;
    }
    .skills-label {
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 10px;
    }
    .skills-h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(32px, 5vw, 46px);
      line-height: 1.1;
    }
    .skills-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: 12px;
      margin-bottom: 56px;
    }
    .skills-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .skills-row {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .skill-card {
      width: 108px;
      height: 108px;
      border-radius: 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.25s, transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
      cursor: default;
    }
    .skill-card:hover { border-color: var(--purple); transform: translateY(-4px); }
    .skill-emoji { font-size: 26px; line-height: 1; }
    .skill-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-align: center;
      padding: 0 6px;
    }

    /* ── OTHER / EXPLORE SECTION ───────────────────────────────────── */
    #section-other {
      max-width: 1160px;
      margin: 0 auto;
      padding: 20px 32px 120px;
    }
    .other-header {
      text-align: center;
      margin-bottom: 12px;
    }
    .other-h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(32px, 5vw, 46px);
      line-height: 1.1;
    }
    .other-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: 12px;
      margin-bottom: 56px;
    }
    .explore-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
      gap: 24px;
    }
    .explore-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 40px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      cursor: pointer;
      transition: border-color 0.25s, transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .explore-card:hover { transform: translateY(-5px); }
    .explore-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .explore-icon svg { width: 28px; height: 28px; }
    .explore-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 22px;
    }
    .explore-sub {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-top: 4px;
    }
    .explore-cta {
      font-size: 14px;
      font-weight: 700;
      margin-top: 16px;
    }

    /* ── FOOTER ────────────────────────────────────────────────────── */
    .footer {
      padding: 26px 32px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ── VIEW PAGES (achievements, guestbook, links, booking) ──────── */
    .view-page {
      max-width: 1160px;
      margin: 0 auto;
      padding: 140px 32px 110px;
      position: relative;
      z-index: 1;
    }
    .view-page-narrow {
      max-width: 760px;
    }
    .view-page-mid {
      max-width: 900px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      margin-bottom: 40px;
      width: fit-content;
      background: none;
      border: none;
      padding: 0;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--text-primary); }

    .view-label {
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .view-h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(32px, 5.5vw, 50px);
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .view-sub {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 48px;
      line-height: 1.6;
    }

    /* Achievements */
    .achievement-featured {
      display: flex;
      flex-wrap: wrap;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      margin-bottom: 24px;
    }
    .achievement-featured-img {
      flex: 1 1 380px;
      aspect-ratio: 16/11;
      position: relative;
      background: #fff;
    }
    .achievement-featured-img img,
    .achievement-featured-img .img-placeholder {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .achievement-featured-text {
      flex: 1 1 300px;
      background: var(--card-bg);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }
    .achievement-featured-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 28px;
      color: var(--text-primary);
    }
    .achievement-featured-desc {
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--text-secondary);
    }
    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }
    .achievement-slot {

      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      position: relative;
    }
    .achievement-slot img,
    .achievement-slot .img-placeholder {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Guestbook */
    .guestbook-form {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 36px;
    }
    .gb-input {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'Manrope', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    .gb-input:focus { border-color: var(--purple); }
    .gb-input::placeholder { color: var(--text-muted); }
    .gb-textarea {
      resize: vertical;
    }
    .gb-submit {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }
    .gb-submit:hover { opacity: 0.88; transform: translateY(-1px); }

    .guestbook-entries { display: flex; flex-direction: column; gap: 14px; }
    .gb-entry {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 20px;
    }
    .gb-entry-name {
      font-weight: 700;
      font-size: 14.5px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .gb-entry-msg {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Links */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .link-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 20px;
      color: var(--text-primary);
      transition: border-color 0.25s, transform 0.25s;
      text-decoration: none;
    }
    .link-card:hover {
      border-color: var(--blue);
      color: var(--text-primary);
      transform: translateY(-3px);
    }
    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(59,130,246,0.12);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .link-icon svg { width: 20px; height: 20px; }
    .link-platform {
      font-size: 14.5px;
      font-weight: 700;
    }
    .link-handle {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Booking */
    .booking-page { max-width: 900px; }
    .booking-h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(28px, 4vw, 42px);
      color: var(--text-primary);
      margin-bottom: 12px;
      line-height: 1.2;
    }
    .booking-sub {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 40px;
    }
    .booking-confirmed {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 60px 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .booking-check {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }
    .booking-check svg { width: 24px; height: 24px; }
    .booking-confirmed-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--text-primary);
    }
    .booking-confirmed-text {
      font-size: 15px;
      color: var(--text-secondary);
    }
    .booking-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .booking-left {
      flex: 1 1 200px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-right: 1px solid var(--card-border);
    }
    .booking-avatar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .booking-mini-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      flex-shrink: 0;
    }
    .booking-name-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--text-primary);
    }
    .booking-info-list {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .booking-info-row { display: flex; align-items: center; gap: 8px; }
    .booking-calendar {
      flex: 2 1 280px;
      padding: 28px 24px;
    }
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .cal-month-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 19px;
      color: var(--text-primary);
    }
    .cal-year {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-left: 6px;
    }
    .cal-nav-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .cal-nav-btn:hover { border-color: var(--purple); }
    .cal-nav-btn svg { width: 14px; height: 14px; }
    .cal-day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 8px;
    }
    .cal-day-header {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 4px 0;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 400;
      cursor: default;
      transition: background 0.15s, color 0.15s;
    }
    .cal-day.available {
      color: var(--text-primary);
      font-weight: 700;
      cursor: pointer;
    }
    .cal-day.available:hover { background: rgba(139,92,246,0.15); }
    .cal-day.selected { background: var(--purple); color: #fff; }
    .cal-day.past { color: var(--text-muted); }
    .cal-day.empty {}
    .booking-times {
      flex: 1 1 200px;
      padding: 28px 20px;
      border-left: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .booking-times-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .time-slot {
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: center;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }
    .time-slot:hover { border-color: var(--purple); color: var(--text-primary); }
    .time-slot.selected { background: var(--purple); border-color: var(--purple); color: #fff; }
    .booking-form {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .booking-form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .booking-form-row { grid-template-columns: 1fr; }
    }
    .booking-input {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'Manrope', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    .booking-input:focus { border-color: var(--purple); }
    .booking-input::placeholder { color: var(--text-muted); }
    .booking-char-count {
      text-align: right;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: -10px;
    }
    .booking-submit {
      align-self: flex-start;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 30px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }
    .booking-submit:hover { opacity: 0.88; transform: translateY(-1px); }

    /* ── IMG PLACEHOLDER ───────────────────────────────────────────── */
    .img-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 16px;
      background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(236,72,153,0.2));
    }

    /* ── RESPONSIVE ────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      #nav { gap: 6px; }
      #book-btn span { display: none; }
      .nav-btn { width: 72px; font-size: 12px; }
      #nav-slider { width: 72px; }
      .about-row { flex-direction: column; }
      .projects-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      #book-btn { padding: 11px 14px; }
    }
  </style>
</head>
<body>
<script src="data/config.js"></script>
<script src="data/about.js"></script>
<script src="data/projects.js"></script>
<script src="data/skills.js"></script>
<script src="data/achievements.js"></script>
<script src="data/links.js"></script>

<div id="app">
  <!-- dot grid -->
  <div class="dot-grid"></div>

  <!-- blobs -->
  <div class="blob" id="blob1"></div>
  <div class="blob" id="blob2"></div>
  <div class="blob" id="blob3"></div>

  <!-- nav -->
  <nav id="nav">
    <button id="theme-toggle" aria-label="Toggle theme">
      <!-- icon injected by JS -->
    </button>
    <div id="nav-pills">
      <div class="nav-pill-container" id="pill-container">
        <div id="nav-slider"></div>
        <!-- buttons injected by JS -->
      </div>
    </div>
    <button id="book-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>Book a Call</span>
    </button>
  </nav>

  <!-- view content -->
  <div id="view-content"></div>
</div>

<script>
(function() {
  // ─── NAV CONFIG ───────────────────────────────────────────────────
  const NAV_ITEMS = [
    { label: 'Home',     section: 'section-home' },
    { label: 'About',    section: 'section-about' },
    { label: 'Projects', section: 'section-projects' },
    { label: 'Skills',   section: 'section-skills' },
    { label: 'Other',    section: 'section-other' },
  ];
  const PILL_W = 100;
  const PILL_GAP = 4;

  // ─── TIME SLOTS ───────────────────────────────────────────────────
  const TIME_SLOTS = ['9:00 AM', '11:00 AM', '2:00 PM', '4:00 PM'];

  // ─── MONTHS ───────────────────────────────────────────────────────
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // ─── SVG ICONS ────────────────────────────────────────────────────

  // ─── PLACEHOLDER HTML ─────────────────────────────────────────────
  function placeholder(text) {
    return `<div class="img-placeholder"><span style="font-size:28px">🖼</span><span>${text || 'Add image'}</span></div>`;
  }

  // ─── IMG WITH FALLBACK ────────────────────────────────────────────
  function imgTag(src, alt, fallbackText) {
    const fb = placeholder(fallbackText || alt || '');
    return `<img src="${src}" alt="${alt || ''}" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','${fb.replace(/"/g,"'").replace(/\n/g,'')}');" style="width:100%;height:100%;object-fit:cover;display:block;" />`;
  }

  // ─── PEEK CAROUSEL FRAMES ────────────────────────────────────────
  function buildPeekFrames(n, current) {
    return Array.from({length: n}, (_, i) => {
      const o = ((i - current) % n + n) % n;
      const norm = o > n/2 ? o - n : o;
      if (norm === 0) return 'position:absolute;inset:0;transform:translateX(0) scale(1);opacity:1;z-index:3;filter:none;transition:all 0.6s cubic-bezier(0.22,1,0.36,1)';
      if (norm < 0)  return 'position:absolute;inset:0;transform:translateX(-62%) scale(0.78);opacity:0.45;z-index:2;filter:blur(1px) brightness(0.55);transition:all 0.6s cubic-bezier(0.22,1,0.36,1)';
      return 'position:absolute;inset:0;transform:translateX(62%) scale(0.78);opacity:0.45;z-index:2;filter:blur(1px) brightness(0.55);transition:all 0.6s cubic-bezier(0.22,1,0.36,1)';
    });
  }

  // ═══════════════════════════════════════════════════════════════════
  // APP CLASS
  // ═══════════════════════════════════════════════════════════════════
  class PortfolioApp {
    constructor() {
      let savedEntries = [];
      try {
        const r = localStorage.getItem('portfolio-guestbook');
        if (r) savedEntries = JSON.parse(r);
      } catch(e) {}

      const now = new Date();
      this.state = {
        theme: localStorage.getItem('portfolio-theme') || 'dark',
        view: 'home',
        chatMessages: [
          { role: 'bot', text: "Hey! I'm an AI assistant trained on Paul's background. Ask me anything about his work, skills, or experience — or tap a quick question below." }
        ],
        chatInput: '',
        calMonth: now.getMonth(),
        calYear: now.getFullYear(),
        selectedDate: null,
        selectedTime: null,
        guestEntries: savedEntries,
        guestName: '',
        guestMsg: '',
        bookingName: '',
        bookingEmail: '',
        bookingTopic: '',
        bookingConfirmed: false,
        activeSection: 'section-home',
        mindsetIndex: 0,
        portraitIndex: 0,
        projectIndices: [0, 0, 0, 0],
      };

      this.quickResponses = {
        work:    { user: 'What have you worked on?',  bot: "Paul has built everything from computer-vision desktop apps to full-stack mobile products — check the Projects section below for the details." },
        about:   { user: 'Tell me about Paul.',        bot: 'Paul Jison is a full-stack software developer who enjoys building complete products end-to-end, from backend architecture to polished interfaces.' },
        skills:  { user: "What's his tech stack?",    bot: 'Paul works across the stack — React, Node.js, TypeScript, Python, and more. See the Skills section for the full list.' },
        contact: { user: 'How do I get in touch?',    bot: "Easiest way is to hit 'Book a Call' up top, or find his links in the Other section." },
      };

      this._mouseX = 0;
      this._mouseY = 0;
      this._blobRaf = null;
    }

    // ── STATE ────────────────────────────────────────────────────────
    setState(updater) {
      const prev = this.state;
      const patch = typeof updater === 'function' ? updater(prev) : updater;
      this.state = { ...prev, ...patch };
      this.render();
    }

    // ── THEME ────────────────────────────────────────────────────────
    applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('portfolio-theme', theme);
      const btn = document.getElementById('theme-toggle');
      if (btn) btn.innerHTML = theme === 'dark' ? icons.moon : icons.sun;
    }

    toggleTheme() {
      const next = this.state.theme === 'dark' ? 'light' : 'dark';
      this.applyTheme(next);
      this.setState({ theme: next });
    }

    // ── RENDER ───────────────────────────────────────────────────────
    render() {
      const s = this.state;

      // apply theme
      this.applyTheme(s.theme);

      // nav slider
      this.updateNavSlider();

      // view content
      const vc = document.getElementById('view-content');
      if (!vc) return;

      if (s.view === 'home') {
        vc.innerHTML = this.renderHome();
        this.attachHomeListeners();
      } else if (s.view === 'achievements') {
        vc.innerHTML = this.renderAchievements();
        this.attachBackListener();
      } else if (s.view === 'guestbook') {
        vc.innerHTML = this.renderGuestbook();
        this.attachGuestbookListeners();
      } else if (s.view === 'links') {
        vc.innerHTML = this.renderLinks();
        this.attachBackListener();
      } else if (s.view === 'booking') {
        vc.innerHTML = this.renderBooking();
        this.attachBookingListeners();
      }
    }

    // ── NAV SLIDER ───────────────────────────────────────────────────
    updateNavSlider() {
      const s = this.state;
      const pillContainer = document.getElementById('pill-container');
      if (!pillContainer) return;

      // rebuild nav buttons if needed
      if (!pillContainer.querySelector('.nav-btn')) {
        NAV_ITEMS.forEach((item, i) => {
          const btn = document.createElement('button');
          btn.className = 'nav-btn';
          btn.setAttribute('data-idx', i);
          btn.setAttribute('data-section', item.section);
          btn.textContent = item.label;
          btn.addEventListener('click', () => {
            if (s.view !== 'home') {
              this.setState({ view: 'home', activeSection: item.section });
              setTimeout(() => {
                const el = document.getElementById(item.section);
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }, 50);
            } else {
              const el = document.getElementById(item.section);
              if (el) el.scrollIntoView({ behavior: 'smooth' });
            }
          });
          pillContainer.appendChild(btn);
        });
      }

      // determine active index
      let activeIdx = 0;
      if (s.view === 'home') {
        activeIdx = NAV_ITEMS.findIndex(n => n.section === s.activeSection);
        if (activeIdx < 0) activeIdx = 0;
      }

      // update button active classes
      const btns = pillContainer.querySelectorAll('.nav-btn');
      btns.forEach((btn, i) => {
        btn.classList.toggle('active', i === activeIdx);
      });

      // move slider
      const slider = document.getElementById('nav-slider');
      if (slider) {
        slider.style.left = (6 + activeIdx * (PILL_W + PILL_GAP)) + 'px';
        slider.style.width = PILL_W + 'px';
      }
    }

    // ── SCROLL TRACKING ──────────────────────────────────────────────
    updateActiveSection() {
      if (this.state.view !== 'home') return;
      const threshold = 160;
      let current = 'section-home';
      for (const item of NAV_ITEMS) {
        const el = document.getElementById(item.section);
        if (el) {
          const rect = el.getBoundingClientRect();
          if (rect.top <= threshold) current = item.section;
        }
      }
      if (current !== this.state.activeSection) {
        this.state.activeSection = current;
        this.updateNavSlider();
      }
    }

    // ── MOUSE BLOBS ──────────────────────────────────────────────────
    startBlobTracking() {
      const blob1 = document.getElementById('blob1');
      const blob2 = document.getElementById('blob2');
      const blob3 = document.getElementById('blob3');

      const tick = () => {
        const dx = this._mouseX / window.innerWidth - 0.5;
        const dy = this._mouseY / window.innerHeight - 0.5;
        if (blob1) blob1.style.transform = `translateX(${dx*58}px) translateY(${dy*58}px)`;
        if (blob2) blob2.style.transform = `translateX(${dx*-70}px) translateY(${dy*-70}px)`;
        if (blob3) blob3.style.transform = `translateX(${dx*44}px) translateY(${dy*-44}px)`;
        this._blobRaf = requestAnimationFrame(tick);
      };
      if (this._blobRaf) cancelAnimationFrame(this._blobRaf);
      tick();
    }

      </section>

      <!-- FOOTER -->
      <footer class="footer">© 2026 ${cfg.name}</footer>
      `;
    }

    attachHomeListeners() {
      // scroll hint
      const sh = document.getElementById('scroll-hint');
      if (sh) sh.addEventListener('click', () => {
        const el = document.getElementById('section-about');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      });

      // chat pills
      document.querySelectorAll('.chat-pill[data-quick]').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-quick');
          const qr = this.quickResponses[key];
          if (!qr) return;
          const msgs = [...this.state.chatMessages,
            { role: 'user', text: qr.user },
            { role: 'bot',  text: qr.bot  }
          ];
          this.setState({ chatMessages: msgs });
        });
      });

      // chat form
      const input = document.getElementById('chat-input');
      const submit = document.getElementById('chat-submit');
      if (input) {
        input.addEventListener('input', e => { this.state.chatInput = e.target.value; });
        input.addEventListener('keydown', e => { if (e.key === 'Enter') this.handleChatSend(); });
      }
      if (submit) submit.addEventListener('click', () => this.handleChatSend());

      // mindset carousel click
      const mc = document.getElementById('mindset-carousel');
      if (mc) mc.addEventListener('click', () => {
        const n = window.PORTFOLIO.about.mindset.images.length;
        const next = (this.state.mindsetIndex + 1) % n;
        this.state.mindsetIndex = next;
        // update peek frames in-place
        const frames = buildPeekFrames(n, next);
        mc.querySelectorAll('.peek-frame').forEach((el, i) => { el.style.cssText = frames[i]; });
        const label = document.getElementById('mindset-label');
        if (label) label.textContent = window.PORTFOLIO.about.mindset.images[next].label;
      });

      // project carousels
      document.querySelectorAll('[id^="proj-carousel-"]').forEach(el => {
        el.addEventListener('click', () => {
          const pi = parseInt(el.getAttribute('data-pi'));
          const n  = parseInt(el.getAttribute('data-n'));
          const cur = this.state.projectIndices[pi] || 0;
          const next = (cur + 1) % n;
          const newIndices = [...this.state.projectIndices];
          newIndices[pi] = next;
          this.state.projectIndices = newIndices;
          const frames = buildPeekFrames(n, next);
          el.querySelectorAll('.peek-frame').forEach((f, i) => { f.style.cssText = frames[i]; });
        });
      });

      // explore cards
      const eg = document.getElementById('explore-guestbook');
      const ea = document.getElementById('explore-achievements');
      const el2 = document.getElementById('explore-links');
      if (eg) eg.addEventListener('click', () => this.setState({ view: 'guestbook' }));
      if (ea) ea.addEventListener('click', () => this.setState({ view: 'achievements' }));
      if (el2) el2.addEventListener('click', () => this.setState({ view: 'links' }));
    }

    handleChatSend() {
      const text = this.state.chatInput.trim();
      if (!text) return;
      const botReply = "Great question! Feel free to explore the sections, or hit 'Book a Call' to chat with Paul directly.";
      const msgs = [...this.state.chatMessages,
        { role: 'user', text },
        { role: 'bot',  text: botReply }
      ];
      this.setState({ chatMessages: msgs, chatInput: '' });
    }

    // ── ACHIEVEMENTS VIEW ────────────────────────────────────────────
    renderAchievements() {
      const ach = window.PORTFOLIO.achievements;
      return `
      <div class="view-page">
        <button class="back-btn" id="back-btn">← Back to home</button>
        <div class="view-label" style="color:var(--orange)">Milestones &amp; Victories</div>
        <h1 class="view-h1">My <span style="color:var(--orange)">Achievements</span></h1>
        <p class="view-sub">Milestones along the way — from shipped products to personal challenges.</p>

        <div class="achievement-featured">
          <div class="achievement-featured-img">
            ${imgTag(ach.featured.image, ach.featured.title, 'Drop featured image')}
          </div>
          <div class="achievement-featured-text">
            <div class="achievement-featured-title">${ach.featured.title}</div>
            <div class="achievement-featured-desc">${ach.featured.description}</div>
          </div>
        </div>

        <div class="achievements-grid">
          ${ach.items.map(item => `
            <div class="achievement-slot">
              ${imgTag(item.image, 'Achievement', item.placeholder)}
            </div>
          `).join('')}
        </div>
      </div>
      `;
    }

    // ── GUESTBOOK VIEW ───────────────────────────────────────────────
    renderGuestbook() {
      const s = this.state;
      return `
      <div class="view-page view-page-narrow" style="margin:0 auto;">
        <button class="back-btn" id="back-btn">← Back to home</button>
        <h1 class="view-h1"><span style="color:var(--purple)">Guest</span>book</h1>
        <p class="view-sub">Leave your mark and let others know you stopped by.</p>

        <div class="guestbook-form">
          <input class="gb-input" id="gb-name" type="text" placeholder="Your name" value="${(s.guestName||'').replace(/"/g,'&quot;')}" />
          <textarea class="gb-input gb-textarea" id="gb-msg" rows="3" placeholder="Say hello...">${s.guestMsg||''}</textarea>
          <button class="gb-submit" id="gb-submit">Sign Guestbook</button>
        </div>

        <div class="guestbook-entries" id="gb-entries">
          ${s.guestEntries.length === 0
            ? `<p style="color:var(--text-muted);font-size:14px;text-align:center;padding:20px 0">No entries yet. Be the first!</p>`
            : s.guestEntries.map(e => `
              <div class="gb-entry">
                <div class="gb-entry-name">${this.escHtml(e.name)}</div>
                <div class="gb-entry-msg">${this.escHtml(e.message)}</div>
              </div>
            `).join('')
          }
        </div>
      </div>
      `;
    }

    attachGuestbookListeners() {
      this.attachBackListener();
      const submit = document.getElementById('gb-submit');
      const nameEl = document.getElementById('gb-name');
      const msgEl  = document.getElementById('gb-msg');
      if (!submit) return;
      if (nameEl) nameEl.addEventListener('input', e => { this.state.guestName = e.target.value; });
      if (msgEl)  msgEl.addEventListener('input',  e => { this.state.guestMsg  = e.target.value; });
      submit.addEventListener('click', () => {
        const name = (nameEl ? nameEl.value : '').trim();
        const msg  = (msgEl  ? msgEl.value  : '').trim();
        if (!name || !msg) return;
        const entry = { name, message: msg, ts: Date.now() };
        const entries = [entry, ...this.state.guestEntries];
        try { localStorage.setItem('portfolio-guestbook', JSON.stringify(entries)); } catch(e) {}
        this.setState({ guestEntries: entries, guestName: '', guestMsg: '' });
      });
    }

    // ── LINKS VIEW ───────────────────────────────────────────────────
    renderLinks() {
      const links = window.PORTFOLIO.links;
      const cfg = window.PORTFOLIO.config;
      return `
      <div class="view-page view-page-mid" style="margin:0 auto;">
        <button class="back-btn" id="back-btn">← Back to home</button>
        <h1 class="view-h1">My <span style="color:var(--blue)">Links</span></h1>
        <p class="view-sub">${cfg.linksSubtitle}</p>
        <div class="links-grid">
          ${links.map(l => `
            <a class="link-card" href="${l.url}" target="_blank" rel="noopener">
              <div class="link-icon">${this.getLinkIcon(l.type)}</div>
              <div>
                <div class="link-platform">${l.platform}</div>
                <div class="link-handle">${l.handle}</div>
              </div>
            </a>
          `).join('')}
        </div>
      </div>
      `;
    }

    getLinkIcon(type) {
      if (type === 'github')   return icons.github;
      if (type === 'linkedin') return icons.linkedin;
      if (type === 'x')        return icons.x;
      if (type === 'email')    return icons.email;
      return icons.link;
    }

    // ── BOOKING VIEW ─────────────────────────────────────────────────
    renderBooking() {
      const s = this.state;
      if (s.bookingConfirmed) {
        return `
        <div class="view-page booking-page" style="margin:0 auto;">
          <button class="back-btn" id="back-btn">← Back to home</button>
          <div class="booking-confirmed">
            <div class="booking-check">${icons.check}</div>
            <div class="booking-confirmed-title">Booking request sent!</div>
            <div class="booking-confirmed-text">Paul will confirm your call over email shortly.</div>
          </div>
        </div>
        `;
      }

      const now = new Date();
      const todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();

      // Calendar
      const year = s.calYear, month = s.calMonth;
      const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
      // Shift so Monday=0
      const startOffset = (firstDay + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let calCells = [];
      for (let i = 0; i < startOffset; i++) calCells.push(null);
      for (let d = 1; d <= daysInMonth; d++) calCells.push(d);

      const isSelected = (d) => {
        if (!s.selectedDate) return false;
        return s.selectedDate.y === year && s.selectedDate.m === month && s.selectedDate.d === d;
      };
      const isPast = (d) => {
        const cellDate = new Date(year, month, d);
        const today = new Date(todayY, todayM, todayD);
        return cellDate < today;
      };

      const calHtml = `
      <div class="cal-header">
        <div>
          <span class="cal-month-title">${MONTH_NAMES[month]}</span>
          <span class="cal-year">${year}</span>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="cal-nav-btn" id="cal-prev">${icons.chevLeft}</button>
          <button class="cal-nav-btn" id="cal-next">${icons.chevRight}</button>
        </div>
      </div>
      <div class="cal-day-headers">
        ${['M','T','W','T','F','S','S'].map(d => `<div class="cal-day-header">${d}</div>`).join('')}
      </div>
      <div class="cal-grid" id="cal-grid">
        ${calCells.map(d => {
          if (!d) return `<div class="cal-day empty"></div>`;
          if (isPast(d)) return `<div class="cal-day past">${d}</div>`;
          const sel = isSelected(d);
          return `<div class="cal-day available${sel?' selected':''}" data-day="${d}">${d}</div>`;
        }).join('')}
      </div>
      `;

      const timesHtml = s.selectedDate
        ? TIME_SLOTS.map(t => `
            <div class="time-slot${s.selectedTime===t?' selected':''}" data-time="${t}">${t}</div>
          `).join('')
        : `<p style="font-size:13px;color:var(--text-muted);line-height:1.5">Select a date from the calendar to see available times.</p>`;

      return `
      <div class="view-page booking-page" style="margin:0 auto;">
        <button class="back-btn" id="back-btn">← Back to home</button>
        <h1 class="booking-h1">Let's bring your <span style="background-image:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent">ideas</span> to life</h1>
        <p class="booking-sub">Select a date and time below to schedule our call.</p>

        <div class="booking-card">
          <div class="booking-left">
            <div class="booking-avatar-row">
              <div class="booking-mini-avatar"></div>
              <div class="booking-name-label">PAUL JISON</div>
            </div>
            <div class="booking-info-list">
              <div class="booking-info-row">✓ Confirmation required</div>
              <div class="booking-info-row">⏱ 30 min session</div>
              <div class="booking-info-row">📹 Google Meet</div>
              <div class="booking-info-row">🌐 Remote</div>
            </div>
          </div>
          <div class="booking-calendar">
            ${calHtml}
          </div>
          <div class="booking-times">
            <div class="booking-times-title">SELECT A TIME</div>
            ${timesHtml}
          </div>
        </div>

        <div class="booking-form">
          <div class="booking-form-row">
            <input class="booking-input" id="bk-name" type="text" placeholder="John Smith" value="${(s.bookingName||'').replace(/"/g,'&quot;')}" />
            <input class="booking-input" id="bk-email" type="email" placeholder="john.smith@example.com" value="${(s.bookingEmail||'').replace(/"/g,'&quot;')}" />
          </div>
          <div>
            <textarea class="booking-input" id="bk-topic" rows="3" placeholder="What would you like to discuss?" maxlength="300">${s.bookingTopic||''}</textarea>
            <div class="booking-char-count" id="bk-char-count">${(s.bookingTopic||'').length}/300</div>
          </div>
          <button class="booking-submit" id="bk-submit">Request a Call</button>
        </div>
      </div>
      `;
    }

    attachBookingListeners() {
      this.attachBackListener();
      const s = this.state;

      // Calendar nav
      const calPrev = document.getElementById('cal-prev');
      const calNext = document.getElementById('cal-next');
      if (calPrev) calPrev.addEventListener('click', () => {
        let m = this.state.calMonth - 1, y = this.state.calYear;
        if (m < 0) { m = 11; y--; }
        this.setState({ calMonth: m, calYear: y });
      });
      if (calNext) calNext.addEventListener('click', () => {
        let m = this.state.calMonth + 1, y = this.state.calYear;
        if (m > 11) { m = 0; y++; }
        this.setState({ calMonth: m, calYear: y });
      });

      // Calendar day clicks
      const calGrid = document.getElementById('cal-grid');
      if (calGrid) calGrid.addEventListener('click', e => {
        const cell = e.target.closest('.cal-day.available');
        if (!cell) return;
        const d = parseInt(cell.getAttribute('data-day'));
        this.setState({ selectedDate: { y: this.state.calYear, m: this.state.calMonth, d }, selectedTime: null });
      });

      // Time slots
      document.querySelectorAll('.time-slot').forEach(el => {
        el.addEventListener('click', () => {
          const t = el.getAttribute('data-time');
          this.setState({ selectedTime: t });
        });
      });

      // Form inputs
      const bkName  = document.getElementById('bk-name');
      const bkEmail = document.getElementById('bk-email');
      const bkTopic = document.getElementById('bk-topic');
      const bkChar  = document.getElementById('bk-char-count');
      if (bkName)  bkName.addEventListener('input',  e => { this.state.bookingName  = e.target.value; });
      if (bkEmail) bkEmail.addEventListener('input', e => { this.state.bookingEmail = e.target.value; });
      if (bkTopic) bkTopic.addEventListener('input', e => {
        this.state.bookingTopic = e.target.value;
        if (bkChar) bkChar.textContent = e.target.value.length + '/300';
      });

      // Submit
      const bkSubmit = document.getElementById('bk-submit');
      if (bkSubmit) bkSubmit.addEventListener('click', () => {
        this.setState({ bookingConfirmed: true });
      });
    }

    // ── BACK BUTTON ──────────────────────────────────────────────────
    attachBackListener() {
      const btn = document.getElementById('back-btn');
      if (btn) btn.addEventListener('click', () => this.setState({ view: 'home' }));
    }

    // ── UTILITIES ────────────────────────────────────────────────────
    escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // ── AUTO-ADVANCE CAROUSELS ───────────────────────────────────────
    startCarouselTimer() {
      setInterval(() => {
        if (this.state.view !== 'home') return;
        const abt = window.PORTFOLIO.about;
        const prj = window.PORTFOLIO.projects;

        const nextMindset = (this.state.mindsetIndex + 1) % abt.mindset.images.length;
        const nextPortrait = (this.state.portraitIndex + 1) % abt.portraits.length;
        const newProjIdx = this.state.projectIndices.map((idx, pi) =>
          (idx + 1) % prj[pi].images.length
        );

        // Update mindset in-place if DOM exists
        const mc = document.getElementById('mindset-carousel');
        if (mc) {
          const frames = buildPeekFrames(abt.mindset.images.length, nextMindset);
          mc.querySelectorAll('.peek-frame').forEach((el, i) => { el.style.cssText = frames[i]; });
          const label = document.getElementById('mindset-label');
          if (label) label.textContent = abt.mindset.images[nextMindset].label;
        }

        // Update portraits in-place
        const pc = document.getElementById('portrait-carousel');
        if (pc) {
          const frames = pc.querySelectorAll('.portrait-frame');
          frames.forEach((f, i) => {
            f.style.opacity = i === nextPortrait ? '1' : '0';
            f.style.zIndex  = i === nextPortrait ? '2' : '1';
          });
        }

        // Update project carousels in-place
        prj.forEach((p, pi) => {
          const el = document.getElementById('proj-carousel-' + pi);
          if (el) {
            const frames = buildPeekFrames(p.images.length, newProjIdx[pi]);
            el.querySelectorAll('.peek-frame').forEach((f, i) => { f.style.cssText = frames[i]; });
          }
        });

        this.state.mindsetIndex  = nextMindset;
        this.state.portraitIndex = nextPortrait;
        this.state.projectIndices = newProjIdx;
      }, 3000);
    }

    // ── INIT ─────────────────────────────────────────────────────────
    init() {
      this.applyTheme(this.state.theme);
      this.render();

      // Build static nav pill buttons once
      this.updateNavSlider();

      // Book btn → booking view
      const bookBtn = document.getElementById('book-btn');
      if (bookBtn) bookBtn.addEventListener('click', () => this.setState({ view: 'booking' }));

      // Theme toggle
      const themeBtn = document.getElementById('theme-toggle');
      if (themeBtn) themeBtn.addEventListener('click', () => this.toggleTheme());

      // Scroll tracking
      window.addEventListener('scroll', () => this.updateActiveSection(), { passive: true });

      // Mouse tracking
      window.addEventListener('mousemove', e => {
        this._mouseX = e.clientX;
        this._mouseY = e.clientY;
      }, { passive: true });
      this.startBlobTracking();

      // Auto-advance carousels
      this.startCarouselTimer();
    }
  }

  // ─── BOOT ─────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    window._app = new PortfolioApp();
    window._app.init();
  });
})();
</script>
</body>
</html>
